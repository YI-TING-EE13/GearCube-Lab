name: Deploy GitHub Pages

on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify candidate is current remote main
        shell: bash
        run: |
          EXPECTED_SHA="${{ github.event.workflow_run.head_sha }}"
          CURRENT_REMOTE_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          echo "Expected SHA from Verify workflow: $EXPECTED_SHA"
          echo "Current remote main SHA: $CURRENT_REMOTE_MAIN"
          if [ "$CURRENT_REMOTE_MAIN" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Current remote main ($CURRENT_REMOTE_MAIN) does not match the verified SHA ($EXPECTED_SHA). Stale deployment prevented."
            exit 1
          fi

      - name: Setup Node.js 22.17.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.17.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with GitHub Pages base path
        shell: bash
        run: |
          RAW_BASE="${{ steps.pages.outputs.base_path }}"
          if [ -z "$RAW_BASE" ] || [ "$RAW_BASE" = "/" ]; then
            PAGES_BASE="/"
          else
            PAGES_BASE="${RAW_BASE%/}/"
          fi
          echo "Building with Vite base: $PAGES_BASE"
          npm run build --workspace=@gearcube/web -- --base="$PAGES_BASE"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
